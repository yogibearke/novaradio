<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Radio signal wave concentric rings -->
  <g transform="translate(256, 265)">
    <!-- Outer wave -->
    <path d="M -160,-30 A 170 170 0 0 1 160,-30" fill="none" stroke="url(#waveGrad)" stroke-width="16" stroke-linecap="round" opacity="0.35" />
    <!-- Middle wave -->
    <path d="M -110,-10 A 120 120 0 0 1 110,-10" fill="none" stroke="url(#waveGrad)" stroke-width="16" stroke-linecap="round" opacity="0.65" />
    <!-- Inner wave -->
    <path d="M -60,10 A 70 70 0 0 1 60,10" fill="none" stroke="url(#waveGrad)" stroke-width="16" stroke-linecap="round" opacity="0.95" />

    <!-- Radio Tower / Beacon Center Core -->
    <circle cx="0" cy="50" r="32" fill="url(#primaryGrad)" filter="url(#glow)" />
    <circle cx="0" cy="50" r="14" fill="#ffffff" />

    <!-- Cast Antenna Beams -->
    <path d="M -35,50 L -75,140 M 35,50 L 75,140 M 0,82 L 0,145" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    <line x1="-85" y1="140" x2="85" y2="140" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
