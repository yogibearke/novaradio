      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#D9480F"/>
    </linearGradient>
    <filter id="r2Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
